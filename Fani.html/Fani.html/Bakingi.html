<script>

let images = [
"image/Scones.jpeg",
"image/Banana Cakes.jpeg",

];

let i = 0;

function changeBackground(){

document.body.style.backgroundImage = "url('" + images[i] + "')";

i++;

if(i == images.length){
i = 0;
}

}

setInterval(changeBackground,3000);

changeBackground();

</script>
